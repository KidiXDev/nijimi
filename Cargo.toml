[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
nijimi-core = { path = "crates/core" }
nijimi-render = { path = "crates/render" }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-cli-support = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.release.package.zlib-rs]
opt-level = 3
